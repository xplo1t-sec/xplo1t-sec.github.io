baseURL = "https://xplo1t-sec.github.io/"
locale = "en-us"
relativeURLs = true
canonifyURLs = false
title = "xplo1t's site"
theme = "PaperMod"

enableRobotsTXT = true

[params]
    ShowReadingTime = true
    ShowShareButtons = true
    ShowToc = true
    ShowBreadCrumbs = true
    ShowPostNavLinks = true
    ShowCodeCopyButtons = true

    [params.label]
        text = "xplo1t's site"
        icon = "/favicon.ico"
        iconHeight = 35

    [params.profileMode]
        enabled = true
        title = "xplo1t"
        subtitle = "Hi there 👋"
        [[params.profileMode.buttons]]
            name = "Blogs"
            url = "/posts"

    [[params.socialIcons]]
        name = "Twitter"
        url = "https://twitter.com/manash036"
    [[params.socialIcons]]
        name = "LinkedIn"
        url = "https://www.linkedin.com/in/manash-saikia"
    [[params.socialIcons]]
        name = "Github"
        url = "https://github.com/xplo1t-sec"
    [[params.socialIcons]]
        name = "Bugcrowd"
        url = "https://bugcrowd.com/xplo1t"
    [[params.socialIcons]]
        name = "Hackerone"
        url = "https://hackerone.com/xplo1t"
    [[params.socialIcons]]
        name = "Intigriti"
        url = "https://app.intigriti.com/profile/xplo1t"
    [[params.socialIcons]]
        name = "Yogosha"
        url = "https://app.yogosha.com/r/xplo1t"

    [params.assets]
        favicon = "/favicon.ico"
        favicon16x16 = "/favicon.ico"
        favicon32x32 = "/favicon.ico"
        apple_touch_icon = "/favicon.ico"
        safari_pinned_tab = "/favicon.ico"
